name: workout_notes
description: "A workout journal for logging sessions, routines, progress, cardio, and body measurements."
publish_to: 'none'

# CI overrides the build name/number via --build-name/--build-number.
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  uuid: ^4.6.0
  intl: ^0.20.2
  shared_preferences: ^2.3.4

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.6

  # Charts & UI
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2

  # Running maps
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Notifications
  flutter_local_notifications: ^22.3.0

  # Export
  share_plus: ^13.3.0

  # Photos
  image_picker: ^1.2.3

  # File import
  file_picker: ^12.1.1

  # AI Coach
  http: ^1.2.2
  flutter_secure_storage: ^10.3.1
  flutter_markdown_plus: ^1.0.10
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  generate: true
  uses-material-design: true
