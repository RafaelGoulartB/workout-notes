name: Release Android

on:
  push:
    branches:
      - main
    # Documentation-only changes do not need a new Android build.
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle"
      - "settings.gradle.kts"
      - ".github/workflows/release-android.yml"
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          pubspec_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          base_version="${pubspec_version%%+*}"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [[ -n "$latest_tag" ]]; then
            current_version="${latest_tag#v}"
          else
            current_version="$base_version"
          fi

          IFS='.' read -r major minor patch <<< "$current_version"
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
            echo "Cannot calculate a patch release from version: $current_version" >&2
            exit 1
          fi

          version="$major.$minor.$((patch + 1))"
          build_number="$((10000 + GITHUB_RUN_NUMBER))"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Required GitHub Actions secret is missing: $value" >&2
              exit 1
            fi
          done

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$keystore_path"
          } > android/key.properties

      - name: Build signed release artifacts
        run: >-
          flutter build appbundle
          --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ steps.version.outputs.build_number }}

      - name: Build ABI-specific APKs
        run: >-
          flutter build apk
          --release
          --split-per-abi
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ steps.version.outputs.build_number }}

      - name: Enforce APK size budget
        shell: bash
        run: |
          set -euo pipefail
          max_bytes=$((50 * 1024 * 1024))
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            size="$(stat -c%s "$apk")"
            if (( size > max_bytes )); then
              echo "APK exceeds 50 MB budget: $apk ($size bytes)" >&2
              exit 1
            fi
          done

      - name: Prepare release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          prefix="workout-notes-${{ steps.version.outputs.version }}-android"
          cp build/app/outputs/bundle/release/app-release.aab "$prefix.aab"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "$prefix-$abi.apk"
          done
          sha256sum "$prefix".aab "$prefix"-*.apk > "$prefix.sha256"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "${{ steps.asset.outputs.prefix }}.aab"
          "${{ steps.asset.outputs.prefix }}"-*.apk
          "${{ steps.asset.outputs.prefix }}.sha256"
          --target "${{ github.sha }}"
          --title "Workout Notes ${{ steps.version.outputs.version }}"
          --generate-notes
