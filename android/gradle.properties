org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Still required (checked with AGP 9.0.1 / Flutter 3.47): without it
# dev.flutter.flutter-gradle-plugin fails to apply because it casts the app
# extension to the legacy AbstractAppExtension, and the Flutter plugins still
# use the legacy android {} DSL. Drop it once Flutter's Gradle plugin and the
# plugins support the new DSL.
android.newDsl=false
# Still required: with built-in Kotlin on, plugins that apply
# org.jetbrains.kotlin.android themselves (share_plus 13) fail with "no longer
# required since AGP 9.0", and the Flutter tool re-adds this flag to
# gradle.properties on every build when it is missing.
android.builtInKotlin=false
